name: C practice validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  academic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PR2 and check the actual test counters
        run: python tools/check_pr2.py
